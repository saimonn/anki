name: Build and Push Sync-Server Image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: read-version
        run: echo "ANKI_VERSION=$(cat .version)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/syncserver/Dockerfile
          push: true
          build-args: ANKI_VERSION=${{ steps.read-version.outputs.ANKI_VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anki:server-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anki:server-${{ steps.read-version.outputs.ANKI_VERSION }}
            ghcr.io/${{ github.repository_owner }}/anki:server-latest
            ghcr.io/${{ github.repository_owner }}/anki:server-${{ steps.read-version.outputs.ANKI_VERSION }}
